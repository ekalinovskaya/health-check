name: Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Health Checks
        run: |
          mkdir -p report
          newman run collections/health-checks.postman_collection.json \
            --reporters htmlextra,json,cli \
            --reporter-htmlextra-export report/report.html \
            --reporter-htmlextra-title "QA Health Check — Full Report" \
            --reporter-htmlextra-darkTheme \
            --reporter-json-export report/results.json \
            --suppress-exit-code

      - name: Generate summary page
        run: node generate-summary.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          force_orphan: true
